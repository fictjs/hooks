name: Node.js Package

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest
      - name: Verify npm publish toolchain
        run: node --version && npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:types
      - run: pnpm test
      - run: pnpm build
      - run: pnpm verify:metadata
      - name: Check published version
        id: published
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@fictjs/hooks@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@fictjs/hooks@${version} is already published."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm publish --provenance
        if: steps.published.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{secrets.NODE_AUTH_TOKEN}}
          CI: true
