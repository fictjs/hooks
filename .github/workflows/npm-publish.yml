name: Node.js Package

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: npm-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.18.0
      - name: Verify npm publish toolchain
        run: node --version && npm --version
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm run format:check
      - run: pnpm typecheck
      - run: pnpm test:types
      - run: pnpm test:types:ts53
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm lint:dist
      - run: pnpm verify:metadata
      - run: pnpm test:attw
      - name: Check published version
        id: published
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@fictjs/hooks@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@fictjs/hooks@${version} is already published."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm publish --access public
        if: steps.published.outputs.published != 'true'
        env:
          CI: true
